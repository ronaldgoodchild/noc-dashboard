services:
  noc:
    build: .
    image: noc-dashboard:latest
    container_name: noc-dashboard
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      NOC_PORT: "8082"
      # SECRET_KEY: "set-a-long-random-value"   # optional; otherwise one is generated and saved
    volumes:
      - noc-data:/data
      # Optional: start from your own server list (copy web/noc_servers.example.json first)
      # - ./noc_servers.json:/data/noc_servers.json

volumes:
  noc-data:
